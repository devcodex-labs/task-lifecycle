name: check-docs
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-docs.mjs
      - run: node --test scripts/validate-config.test.mjs scripts/maintenance-regression.test.mjs
